name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: drink_order_perf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: 导入测试库
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -p123456 drink_order_perf < deploy/mysql/init/01-drink_order.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -p123456 drink_order_perf < deploy/mysql/init/02-order_index.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -p123456 drink_order_perf < deploy/mysql/init/03-order_index_user_time.sql
      - name: mvn verify
        run: mvn -B -f backend/pom.xml verify

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: npm ci
        working-directory: frontend/${{ matrix.app }}
        run: npm ci
      - name: npm run build
        working-directory: frontend/${{ matrix.app }}
        run: npm run build